<html lang="es">

<style>
  :root{
    --tinta:#202040;        /* azul del logo */
    --trama:#3D3D6B;        /* hover y enlaces */
    --verde:#009C7E;        /* verde del chevron */
    --verde-osc:#007D64;
    --sello:#C8102E;
    --papel:#F5F6F9; --linea:#D6D9E6; --texto:#4A4F5E;
    --hondo:#202040; --ambar:#B45309;
  }
  h1,h2,.numero{font-family:'IBM Plex Serif',Georgia,serif; letter-spacing:-.01em}
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:16px; line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  main{max-width:760px; margin:0 auto; padding:32px 20px 64px}
  main.ancho{max-width:none; padding:0 0 64px}
  main.ancho > .cuerpo{max-width:760px; margin:0 auto; padding:0 20px}
  h1{font-size:30px; line-height:1.15; margin:8px 0 0}
  h2{font-size:19px; margin:0}
  p{margin:8px 0}
  a{color:var(--trama)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .cab{border-bottom:2px solid var(--tinta); padding-bottom:20px}
  .sub{color:var(--texto); max-width:62ch}
  .volver{font-weight:600; text-decoration:none; font-size:15px}

  /* ---- Portada ---- */
  .hero{
    background:
      linear-gradient(160deg, rgba(0,32,91,.94) 0%, rgba(0,32,91,.86) 55%, rgba(27,58,107,.92) 100%),
      url('portada.jpg') center/cover no-repeat, var(--hondo);
    color:#fff; padding:34px 0 92px; margin-bottom:-64px;
  }
  .hero-in{max-width:760px; margin:0 auto; padding:0 20px}
  .marca-fila{display:flex; justify-content:flex-end; margin-bottom:26px}
  .marca{display:inline-flex; align-items:center; background:#fff; padding:12px 18px; border-radius:6px}
  .marca img{height:56px; width:auto; display:block}
  @media(max-width:520px){.marca-fila{justify-content:flex-start; margin-bottom:18px}}
  .chip{
    display:table; margin-top:0; font-family:'IBM Plex Mono',monospace;
    font-size:13px; letter-spacing:.04em; color:#fff;
    border:1px solid rgba(255,255,255,.45); padding:4px 12px; border-radius:999px;
  }
  .hero h1{color:#fff; font-size:34px; margin:14px 0 0; max-width:18ch}
  .hero p{color:rgba(255,255,255,.86); max-width:56ch; font-size:16px}

  .tarjetas{display:grid; gap:18px; position:relative}
  @media(min-width:720px){.tarjetas{grid-template-columns:1fr 1fr}}
  .tj{
    background:#fff; border:1px solid var(--linea); border-radius:12px; padding:24px;
    box-shadow:0 10px 30px rgba(0,32,91,.10); text-decoration:none; color:inherit;
    display:flex; flex-direction:column;
  }
  .tj h2{font-size:21px; margin:14px 0 0}
  .tj p{color:var(--texto); font-size:15px; flex:1}
  .tj svg{width:34px; height:34px}
  .cta{
    display:inline-flex; align-items:center; gap:9px; align-self:flex-start;
    color:#fff; font-weight:600; font-size:15px; padding:11px 20px; border-radius:8px;
    margin-top:16px; transition:filter .15s;
  }
  .cta:hover{filter:brightness(1.12)}
  .cta.azul{background:var(--tinta)}
  .cta.verde{background:var(--verde)}

  .buscador{
    display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--linea);
    border-radius:999px; padding:7px 8px 7px 20px; margin-top:26px;
    box-shadow:0 6px 20px rgba(0,32,91,.08);
  }
  .buscador input{border:none; box-shadow:none !important; flex:1; padding:8px 0; font-size:15px}
  .buscador button{
    background:var(--tinta); color:#fff; border:none; border-radius:999px;
    font-weight:600; font-size:15px; padding:11px 22px; white-space:nowrap;
  }
  .buscador button:hover{background:var(--trama)}
  @media(max-width:520px){
    .hero h1{font-size:27px}
    .buscador{flex-wrap:wrap; border-radius:14px; padding:12px}
    .buscador input{width:100%; flex:none}
    .buscador button{width:100%; border-radius:8px}
  }

  .marco{background:#fff; border:2px solid var(--tinta); padding:20px}
  label{
    display:block; margin-bottom:5px; font-size:11.5px; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; color:#6B7180;
  }
  input,textarea,select{
    width:100%; background:#fff; border:1px solid var(--linea); padding:9px 11px;
    font-family:inherit; font-size:15px; color:var(--texto); border-radius:0;
  }
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--trama); box-shadow:0 0 0 3px rgba(46,95,163,.18)}
  input:read-only,input:disabled{background:var(--papel)}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .rejilla{display:grid; gap:16px; margin-top:24px}
  @media(min-width:640px){.rejilla{grid-template-columns:1fr 1fr}}

  button{font-family:inherit; cursor:pointer; border-radius:0}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--tinta); color:#fff; border:2px solid var(--tinta);
    font-weight:600; font-size:15px; padding:11px 20px; transition:background .15s;
  }
  .btn:hover{background:var(--trama); border-color:var(--trama)}
  .btn:disabled{opacity:.5; cursor:default}
  .btn.verde{background:var(--verde); border-color:var(--verde)}
  .btn.verde:hover{background:var(--verde-osc); border-color:var(--verde-osc)}
  .btn2{
    display:inline-flex; align-items:center; justify-content:center;
    background:#fff; color:var(--tinta); border:2px solid var(--tinta);
    font-weight:600; font-size:15px; padding:11px 20px; text-decoration:none; transition:all .15s;
  }
  .btn2:hover{background:var(--tinta); color:#fff}
  .acciones{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
  :focus-visible{outline:3px solid var(--trama); outline-offset:2px}

  .aviso{border-left:4px solid var(--sello); background:#fff; padding:12px 14px; margin-top:18px; color:var(--sello); font-size:15px}
  .nota{border-left:4px solid var(--linea); background:#fff; padding:12px 14px; margin-top:18px; color:var(--texto); font-size:15px}

  .prendas{margin-top:14px; border:1px solid var(--linea); background:#fff; list-style:none; padding:0}
  .prendas li{border-bottom:1px solid var(--linea); padding:9px 12px}
  .prendas li:last-child{border-bottom:none}
  .prendas li.activo{background:var(--papel)}
  .fila{display:flex; align-items:center; gap:12px}
  .fila span{flex:1; font-size:15px; font-weight:500}
  .fila input{width:76px; text-align:center}
  .desc{margin-top:8px}
  .totales{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--tinta); padding-bottom:8px; margin-top:36px}

  table{width:100%; border-collapse:collapse; font-size:15px; margin-top:14px}
  th,td{border:1px solid var(--linea); padding:7px 10px; text-align:left}
  th{background:var(--papel)}
  td.num,th.num{text-align:center; width:82px}
  tr.dif{background:rgba(200,16,46,.06)}
  tr.total{background:var(--papel); font-weight:700}

  .hoja h2{border:2px solid var(--tinta); border-radius:999px; padding:6px 20px; font-size:17px}
  .hoja-cab{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:1px solid var(--linea); padding-bottom:14px}
  .numero{font-size:23px; font-weight:600; color:var(--sello); margin:0}
  .datos{display:grid; grid-template-columns:1fr 1fr; gap:2px 22px; margin:14px 0 0; padding:0}
  .datos div{border-bottom:1px solid var(--linea); padding:5px 0}
  .datos dt{font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; color:#6B7180}
  .datos dd{margin:0; color:var(--texto)}
  .logo-hoja{height:40px; width:auto}
  .sello-anulada{
    border:3px solid var(--sello); color:var(--sello); font-weight:700; font-size:15px;
    letter-spacing:.12em; padding:5px 16px; transform:rotate(-6deg); display:inline-block;
  }
  .firmas{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px; font-size:12.5px}
  .firmas div{border:1px solid var(--linea); padding:8px 10px}
  .firmas dt{font-weight:600; text-transform:uppercase; letter-spacing:.07em;
    font-size:10.5px; color:#6B7180}
  .firmas dd{margin:2px 0 0; color:var(--texto)}

  .lista{list-style:none; padding:0; margin:24px 0 0}
  .lista li{margin-bottom:12px}
  .tarjeta{width:100%; text-align:left; background:#fff; border:2px solid var(--tinta); padding:16px; font:inherit; color:inherit; transition:background .15s}
  .tarjeta:hover{background:var(--papel)}
  .lin1{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px}
  .estado{font-size:13px; font-weight:600; padding:4px 12px; border:1px solid var(--tinta); white-space:nowrap}
  .estado.paso1{background:#fff; color:var(--tinta)}
  .estado.paso2{background:#FDF2E3; border-color:var(--ambar); color:var(--ambar)}
  .estado.paso3{background:#E7EEF8; border-color:var(--trama); color:var(--trama)}
  .estado.paso4{background:var(--verde); border-color:var(--verde); color:#fff}
  .estado.nula{background:var(--sello); border-color:var(--sello); color:#fff}

  .filtros{display:flex; gap:8px; margin-top:20px; flex-wrap:wrap}
  .filtros button{background:#fff; border:1px solid var(--linea); color:var(--tinta); font-weight:600; font-size:15px; padding:9px 16px}
  .filtros button[aria-pressed=true]{background:var(--tinta); border-color:var(--tinta); color:#fff}
  .fechas{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-top:16px}
  .fechas > div{flex:1; min-width:150px}
  .barra{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:2px solid var(--tinta); padding-bottom:20px}
  .cargando{color:var(--texto); margin-top:32px}

  /* ---- Línea de tiempo del trabajador ---- */
  .ruta{list-style:none; padding:0; margin:14px 0 0}
  .ruta li{display:flex; gap:12px; padding:6px 0; font-size:14.5px; color:#94A3B8}
  .ruta li.hecho{color:var(--texto)}
  .ruta .bolita{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--linea);
    flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; background:#fff;
  }
  .ruta li.hecho .bolita{background:var(--verde); border-color:var(--verde)}
  .ruta strong{display:block; color:inherit}
  .ruta small{color:#94A3B8}

  #tramoya{
    position:fixed; left:0; top:0; width:720px; background:#fff;
    opacity:0; pointer-events:none; z-index:-1; overflow:hidden;
  }
  #tramoya .hoja{width:720px; font-size:13px; padding:18px; border-width:2px}
  #tramoya .hoja table{font-size:12.5px}
  #tramoya .hoja th, #tramoya .hoja td{padding:4px 8px}
  #tramoya .hoja .numero{font-size:20px}
  #tramoya .hoja .datos dd{font-size:13px}
  #tramoya .hoja .firmas{font-size:11px}

  @media print{
    .no-print{display:none !important}
    body{background:#fff}
    main{padding:0; max-width:none}
    .hoja{border:2px solid var(--tinta)}
    @page{size:A4; margin:12mm}
    .logo-hoja{height:36px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ==========================================================

   Supabase → Project Settings → API

const SUPABASE_URL = 'https://ecntfuprquxyhtkbywty.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjbnRmdXBycXV4eWh0a2J5d3R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDc3ODksImV4cCI6MjEwNDU4Mzc4OX0.Ykido1Fod1IfAatanCrihQFzdoIXVW_mZCIy63jwWbs';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIPOS = ['CAMISA MANGA CORTA','CAMISA MANGA LARGA','POLO MANGA CORTA','POLO MANGA LARGA',
  'CHOMPA DE LANA','PANTALÓN JEANS','PANTALÓN DRILL','OVEROL SIMPLE','OVEROL TÉRMICO',
  'CASACA TÉRMICA','CHALECO','BIVIDÍ','TOALLA','CORTA VIENTO','SHORT','CALZONCILLO',
  'MEDIAS','POLERAS','PANTALÓN BUZO','PIJAMA','OTROS'];

const HOTELES = {
  'Hotel Smith':              { empresa:'SMITHVC INVERSIONES S.R.L',  ruc:'20608341383' },
  'Hotel Smith 2':            { empresa:'SMITHVC INVERSIONES S.R.L',  ruc:'20608341383' },
  'Hotel Villaverde':         { empresa:'LUIS JAVIER JIMENEZ LOAYZA', ruc:'10413443771' },
  'Hotel Perla del Pacífico': { empresa:'LUIS JAVIER JIMENEZ LOAYZA', ruc:'10413443771' }
};

// Cadena de aprobaciones
const PASOS = [
  { est:'registrada', corto:'Por verificar',   largo:'Registrada por el trabajador' },
  { est:'verificada', corto:'Por recoger',     largo:'Verificada en recepción' },
  { est:'recogida',   corto:'En lavandería',   largo:'Recogida por la lavandería' },
  { est:'entregada',  corto:'Lista en hotel',  largo:'Devuelta limpia al hotel' }
];
const indicePaso = e => PASOS.findIndex(p => p.est === e);
const claseEstado = e => e === 'anulada' ? 'nula' : 'paso' + (indicePaso(e) + 1);
const textoEstado = e => e === 'anulada' ? 'Anulada' : (PASOS[indicePaso(e)]?.corto || e);

const app = document.getElementById('app');
const corr = n => String(n).padStart(5,'0');
const fecha = iso => { if(!iso) return ''; const [a,m,d] = iso.slice(0,10).split('-'); return `${d}/${m}/${a}`; };
const sello = iso => iso ? new Date(iso).toLocaleString('es-PE') : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoy = () => new Date().toISOString().slice(0,10);

let form = null, items = null, emitida = null, sesion = null, perfil = null,
    filtro = '', boletas = [], abierta = null, detalle = [], valida = null,
    dniPrefill = '', desde = '', hasta = '';

const resetForm = () => {
  form = { fecha:hoy(), empresa:'JJC CONTRATISTAS GENERALES S.A.', nombres:'', dni:'',
           hospedaje:'', habitacion:'', lav_empresa:'', lav_ruc:'', observaciones:'' };
  items = TIPOS.map(() => ({ cantidad:'', descripcion:'' }));
};
resetForm();

/* ---------- Router ---------- */
window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange((_e, s) => { sesion = s; perfil = null; filtro = ''; render(); });

(async () => {
  const { data } = await sb.auth.getSession();
  sesion = data.session;
  render();
})();

function ruta(){ return (location.hash || '#/').replace('#','') || '/'; }
function ir(r){ location.hash = '#' + r; }

async function render(){
  const r = ruta();
  app.className = '';
  if (r === '/boleta') return emitida ? vistaEmitida() : vistaFormulario();
  if (r === '/mis-boletas') { const d = dniPrefill; dniPrefill = ''; return vistaMisBoletas(null, null, d, !!d); }
  if (r === '/panel') return vistaPrivada();
  return vistaPortal();
}

/* ---------- Portada ---------- */
const icoRopa = `<svg viewBox="0 0 24 24" fill="none" stroke="#1B3A6B" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round"><path d="M9 3l3 2 3-2 5 3-2 4h-2v11H8V10H6L4 6z"/></svg>`;
const icoEscudo = `<svg viewBox="0 0 24 24" fill="none" stroke="#00875A" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>`;
const icoLupa = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#64748B"
  stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;

function vistaPortal(){
  emitida = null;
  app.className = 'ancho';
  app.innerHTML = `
    <section class="hero">
      <div class="hero-in">
        <div class="marca-fila">
          <div class="marca"><img src="jjc.png" alt="JJC Ingeniería y Construcción"></div>
        </div>
        <p class="chip">CC0174 · Marcobre — Mina Justa</p>
        <h1>Portal digital de boletas de lavandería</h1>
        <p>El mismo talonario de siempre, ahora en el celular. Cada boleta recibe su número
        apenas se registra y avanza con el visto bueno de recepción y de la lavandería.</p>
      </div>
    </section>

    <div class="cuerpo">
      <div class="tarjetas">
        <a class="tj" href="#/boleta">
          ${icoRopa}
          <h2>Enviar mi ropa</h2>
          <p>Llena tu boleta con tu DNI y las prendas que entregas. Al guardarla te damos
          el número para imprimir o mostrar en recepción.</p>
          <span class="cta azul">Llenar boleta</span>
        </a>
        <a class="tj" href="#/panel">
          ${icoEscudo}
          <h2>Recepción y lavandería</h2>
          <p>Ingresa con tu usuario para dar el visto bueno que te corresponde:
          verificación en el hotel, recojo y devolución de la ropa limpia.</p>
          <span class="cta verde">Iniciar sesión</span>
        </a>
      </div>

      <div class="buscador">
        ${icoLupa}
        <input id="dniPortada" inputmode="numeric" maxlength="8"
               placeholder="Ingresa tu DNI para consultar el estado de tu ropa"
               aria-label="Consultar boletas por DNI">
        <button id="verEstado">Consultar</button>
      </div>
    </div>`;

  const inp = document.getElementById('dniPortada');
  inp.addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g,''));
  const go = () => { dniPrefill = inp.value.trim(); ir('/mis-boletas'); };
  document.getElementById('verEstado').addEventListener('click', go);
  inp.addEventListener('keydown', e => e.key === 'Enter' && go());
}

/* ---------- Formulario ---------- */
function totalPrendas(){ return items.reduce((s,i) => s + (parseInt(i.cantidad,10)||0), 0); }

function campo(k, etiqueta, tipo='text', ph='', ro=false){
  return `<div>
    <label for="${k}">${etiqueta}</label>
    <input id="${k}" data-f="${k}" type="${tipo}" ${ro?'readonly':''}
      ${k==='dni'?'inputmode="numeric" maxlength="8" class="mono"':''}
      ${k==='lav_ruc'?'class="mono"':''}
      placeholder="${ph}" value="${esc(form[k])}">
  </div>`;
}

function vistaFormulario(aviso){
  app.innerHTML = `
    <header class="cab">
      <a class="volver" href="#/">← Inicio</a>
      <h1>Enviar mi ropa</h1>
      <p class="sub">El número de boleta se asigna solo, al momento de guardar.</p>
    </header>
    <section class="rejilla">
      ${campo('fecha','Fecha','date')}
      ${campo('empresa','Empresa')}
      ${campo('nombres','Nombres y apellidos','text','Ej. HUALLANCA HUAMANI, JULIO CESAR')}
      ${campo('dni','DNI','text','8 dígitos')}
      <div>
        <label for="hospedaje">Hospedaje</label>
        <select id="hospedaje">
          <option value="">Selecciona el hotel…</option>
          ${Object.keys(HOTELES).map(h =>
            `<option value="${h}" ${form.hospedaje===h?'selected':''}>${h}</option>`).join('')}
        </select>
      </div>
      ${campo('habitacion','Nº habitación')}
      ${campo('lav_empresa','Empresa de lavandería','text','Se completa según el hotel', true)}
      ${campo('lav_ruc','RUC','text','Se completa según el hotel', true)}
    </section>
    <section>
      <div class="totales">
        <h2>Prendas que entregas</h2>
        <p class="mono" style="margin:0">Total: <strong style="color:var(--sello)" id="tot">${totalPrendas()}</strong></p>
      </div>
      <ul class="prendas">
        ${TIPOS.map((t,i) => {
          const act = (parseInt(items[i].cantidad,10)||0) > 0;
          return `<li class="${act?'activo':''}">
            <div class="fila">
              <span>${t}</span>
              <input type="number" min="0" inputmode="numeric" data-cant="${i}"
                     aria-label="Cantidad de ${t}" value="${esc(items[i].cantidad)}">
            </div>
            ${act ? `<input class="desc" data-desc="${i}" aria-label="Descripción de ${t}"
                     placeholder="Descripción (color, marca, detalle)" value="${esc(items[i].descripcion)}">` : ''}
          </li>`;
        }).join('')}
      </ul>
    </section>
    <section style="margin-top:24px">
      <label for="observaciones">Observaciones</label>
      <textarea id="observaciones" data-f="observaciones" rows="3"
        placeholder="Manchas, prendas delicadas, indicaciones de lavado…">${esc(form.observaciones)}</textarea>
    </section>
    ${aviso ? `<p class="aviso" role="alert">${esc(aviso)}</p>` : ''}
    <div class="acciones">
      <button class="btn" id="guardar">Guardar y generar número</button>
      <a class="btn2" href="#/mis-boletas">Ver mis boletas</a>
    </div>`;

  app.querySelectorAll('[data-f]').forEach(el =>
    el.addEventListener('input', e => { form[e.target.dataset.f] = e.target.value; }));

  document.getElementById('hospedaje').addEventListener('change', e => {
    form.hospedaje = e.target.value;
    const h = HOTELES[form.hospedaje];
    form.lav_empresa = h ? h.empresa : '';
    form.lav_ruc = h ? h.ruc : '';
    document.getElementById('lav_empresa').value = form.lav_empresa;
    document.getElementById('lav_ruc').value = form.lav_ruc;
  });

  app.querySelectorAll('[data-cant]').forEach(el =>
    el.addEventListener('input', e => {
      const i = +e.target.dataset.cant;
      const v = e.target.value.replace(/\D/g,'');
      const antes = (parseInt(items[i].cantidad,10)||0) > 0;
      items[i].cantidad = v;
      const ahora = (parseInt(v,10)||0) > 0;
      if (antes !== ahora) { vistaFormulario(); const n = app.querySelector(`[data-cant="${i}"]`); n.focus(); n.select?.(); }
      else document.getElementById('tot').textContent = totalPrendas();
    }));

  app.querySelectorAll('[data-desc]').forEach(el =>
    el.addEventListener('input', e => { items[+e.target.dataset.desc].descripcion = e.target.value; }));

  document.getElementById('guardar').addEventListener('click', guardar);
}

async function guardar(){
  if (!form.nombres.trim()) return vistaFormulario('Escribe tus nombres y apellidos.');
  if (!/^\d{8}$/.test(form.dni.trim())) return vistaFormulario('El DNI debe tener 8 dígitos.');
  if (!form.hospedaje.trim()) return vistaFormulario('Selecciona tu hospedaje.');
  if (totalPrendas() === 0) return vistaFormulario('Ingresa la cantidad de al menos una prenda.');

  const btn = document.getElementById('guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const { data: boleta, error: e1 } = await sb.from('boletas').insert({
      fecha: form.fecha,
      empresa: form.empresa.trim(),
      nombres: form.nombres.trim().toUpperCase(),
      dni: form.dni.trim(),
      hospedaje: form.hospedaje.trim().toUpperCase(),
      habitacion: form.habitacion.trim(),
      lavanderia: form.lav_empresa || null,
      ruc: form.lav_ruc || null,
      observaciones: form.observaciones.trim() || null,
      total_prendas: totalPrendas()
    }).select().single();
    if (e1) throw e1;

    const det = items.map((it,i) => ({
      boleta_id: boleta.id, tipo_ropa: TIPOS[i],
      cantidad: parseInt(it.cantidad,10) || 0,
      descripcion: it.descripcion.trim() || null, orden: i
    })).filter(x => x.cantidad > 0);

    const { error: e2 } = await sb.from('boleta_items').insert(det);
    if (e2) throw e2;

    emitida = { ...boleta, detalle: det };
    vistaEmitida();
    window.scrollTo({top:0});
  } catch (err) {
    vistaFormulario('No se pudo guardar la boleta: ' + (err.message || 'revisa tu conexión.'));
  }
}

async function descargarPDF(b, det){
  const caja = document.getElementById('tramoya');
  caja.innerHTML = hojaHTML(b, det);
  await html2pdf().set({
    margin: 8, filename: `Boleta_${corr(b.numero)}_${b.dni}.pdf`,
    image: { type:'jpeg', quality:0.96 },
    html2canvas: { scale:2, useCORS:true },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak: { mode: ['css','legacy'] }
  }).from(caja.firstElementChild).save();
  caja.innerHTML = '';
}

async function blobPDF(b, det){
  const caja = document.getElementById('tramoya');
  caja.innerHTML = hojaHTML(b, det);
  const blob = await html2pdf().set({
    margin: 8, image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(caja.firstElementChild).outputPdf('blob');
  caja.innerHTML = '';
  return blob;
}

async function descargarUnido(lista){
  const btn = document.getElementById('unido');
  const rotulo = btn ? btn.textContent : '';
  const caja = document.getElementById('tramoya');
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Preparando…'; }
    const { data: todos } = await sb.from('boleta_items').select('*')
      .in('boleta_id', lista.map(b => b.id)).order('orden');

    // Todas las hojas quedan en el DOM: html2canvas necesita elementos visibles
    caja.innerHTML = lista.map(b =>
      `<div>${hojaHTML(b, (todos || []).filter(i => i.boleta_id === b.id))}</div>`).join('');
    const hojas = Array.from(caja.children);

    const opc = { margin: 8, image:{type:'jpeg',quality:0.96},
                  html2canvas:{scale:2,useCORS:true},
                  jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
                  pagebreak:{mode:['css','legacy']} };

    let worker = html2pdf().set(opc).from(hojas[0]).toPdf();
    for (let i = 1; i < hojas.length; i++) {
      const hoja = hojas[i], n = i + 1;
      worker = worker
        .get('pdf').then(pdf => {
          if (btn) btn.textContent = `Armando página ${n} de ${hojas.length}…`;
          pdf.addPage();
        })
        .from(hoja).toContainer().toCanvas().toPdf();
    }

    const tramo = (desde || hasta) ? `_${desde||'inicio'}_a_${hasta||'hoy'}` : '';
    if (btn) btn.textContent = 'Guardando…';
    await worker.save(`Boletas_entregadas${tramo}.pdf`);
  } catch (err) {
    alert('No se pudo generar el PDF: ' + (err.message || err));
  } finally {
    caja.innerHTML = '';
    if (btn) { btn.disabled = false; btn.textContent = rotulo; }
  }
}

async function descargarZIP(lista){
  const btn = document.getElementById('zip');
  const rotulo = btn ? btn.textContent : '';
  const zip = new JSZip();
  const { data: todos } = await sb.from('boleta_items').select('*')
    .in('boleta_id', lista.map(b => b.id)).order('orden');
  let n = 0;
  for (const b of lista) {
    n++;
    if (btn) btn.textContent = `Generando ${n} de ${lista.length}…`;
    zip.file(`Boleta_${corr(b.numero)}_${b.dni}.pdf`,
             await blobPDF(b, (todos || []).filter(i => i.boleta_id === b.id)));
  }
  if (btn) btn.textContent = 'Comprimiendo…';
  const salida = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(salida);
  const a = document.createElement('a');
  const tramo = (desde || hasta) ? `_${desde||'inicio'}_a_${hasta||'hoy'}` : '';
  a.href = url; a.download = `Boletas_entregadas${tramo}.zip`;
  a.click();
  URL.revokeObjectURL(url);
  if (btn) btn.textContent = rotulo;
}

/* ---------- Detalle y aprobaciones ---------- */
async function vistaDetalle(aviso){
  if (!detalle.length) {
    app.innerHTML = `<p class="cargando">Cargando boleta…</p>`;
    const { data } = await sb.from('boleta_items').select('*').eq('boleta_id', abierta.id).order('orden');
    detalle = (data || []).map(i => ({ ...i, contado: i.cantidad_confirmada ?? i.cantidad }));
  }
  const b = abierta;
  const rol = perfil.rol;
  const contado = detalle.reduce((s,i) => s + (parseInt(i.contado,10)||0), 0);
  const dif = contado !== b.total_prendas;

  // ¿Qué puede hacer este usuario con esta boleta?
  const puedeVerificar = (rol === 'recepcion' || rol === 'admin') && b.estado === 'registrada';
  const puedeRecoger   = (rol === 'lavanderia' || rol === 'admin') && b.estado === 'verificada';
  const puedeEntregar  = (rol === 'lavanderia' || rol === 'admin') && b.estado === 'recogida';
  const cuenta = puedeRecoger;   // solo lavandería cuenta y pesa

  app.innerHTML = `
    <button class="volver" id="atras" style="background:none;border:none;color:var(--trama);padding:0">← Volver a la lista</button>
    <div class="marco" style="margin-top:16px">
      <div class="hoja-cab">
        <p class="numero mono">Nº ${corr(b.numero)}</p>
        <span class="estado ${claseEstado(b.estado)}">${textoEstado(b.estado)}</span>
      </div>
      <p style="font-size:18px;font-weight:700;margin:14px 0 0">${esc(b.nombres)}</p>
      <p style="color:var(--texto);font-size:15px;margin:2px 0 0">DNI ${esc(b.dni)} · ${fecha(b.fecha)}</p>
      <p style="color:var(--texto);font-size:15px;margin:2px 0 0">${esc(b.hospedaje)}${
        b.habitacion?` — Hab. ${esc(b.habitacion)}`:''}</p>
      ${b.lavanderia?`<p style="color:var(--texto);font-size:15px;margin:2px 0 0">${
        esc(b.lavanderia)} · RUC ${esc(b.ruc||'')}</p>`:''}
      ${b.observaciones?`<p class="nota">Indicación del trabajador: ${esc(b.observaciones)}</p>`:''}
      <dl class="firmas">
        <div><dt>Recepción</dt><dd>${b.verificada_por_nombre
          ? esc(b.verificada_por_nombre) + '<br>' + sello(b.verificada_en) : 'Pendiente'}</dd></div>
        <div><dt>Recojo</dt><dd>${b.validado_por_nombre
          ? esc(b.validado_por_nombre) + '<br>' + sello(b.validado_en) : 'Pendiente'}</dd></div>
        <div><dt>Entrega</dt><dd>${b.entregada_por_nombre
          ? esc(b.entregada_por_nombre) + '<br>' + sello(b.entregada_en) : 'Pendiente'}</dd></div>
      </dl>
    </div>

    <div class="totales"><h2>${cuenta ? 'Conteo de prendas' : 'Prendas declaradas'}</h2></div>
    <table>
      <thead><tr><th>Prenda</th><th class="num">Declarado</th>${
        cuenta || b.estado === 'recogida' || b.estado === 'entregada'
          ? '<th class="num">Contado</th>' : ''}</tr></thead>
      <tbody>
        ${detalle.map(i => {
          const d = (parseInt(i.contado,10)||0) !== i.cantidad;
          return `<tr class="${cuenta && d ? 'dif' : ''}">
            <td>${i.tipo_ropa}${i.descripcion?`<span style="display:block;font-size:13px;color:var(--texto)">${esc(i.descripcion)}</span>`:''}</td>
            <td class="num mono">${i.cantidad}</td>
            ${cuenta
              ? `<td class="num"><input type="number" min="0" class="mono" style="text-align:center"
                   data-cont="${i.id}" aria-label="Cantidad contada de ${i.tipo_ropa}"
                   value="${esc(i.contado)}"></td>`
              : (b.estado === 'recogida' || b.estado === 'entregada'
                  ? `<td class="num mono">${i.cantidad_confirmada ?? '—'}</td>` : '')}
          </tr>`;
        }).join('')}
        <tr class="total"><td style="text-align:right">Totales</td>
          <td class="num mono">${b.total_prendas}</td>
          ${cuenta ? `<td class="num mono" style="${dif?'color:var(--sello)':''}">${contado}</td>`
            : (b.estado === 'recogida' || b.estado === 'entregada' ? `<td class="num mono"></td>` : '')}
        </tr>
      </tbody>
    </table>
    ${cuenta && dif ? `<p class="aviso">El conteo no coincide con lo declarado. Anota el motivo antes de confirmar el recojo.</p>`:''}

    ${puedeRecoger ? `
    <div class="rejilla" style="grid-template-columns:170px 1fr">
      <div><label for="kg">Total kilos</label>
        <input id="kg" class="mono" type="number" step="0.01" min="0" value="${esc(valida.kilos)}"></div>
      <div><label for="obsl">Observaciones del recojo</label>
        <input id="obsl" value="${esc(valida.obs)}"
          placeholder="Prendas faltantes, manchas, detalles…"></div>
    </div>` : ''}

    ${puedeEntregar ? `
    <div style="margin-top:24px">
      <label for="obse">Observaciones de la entrega</label>
      <input id="obse" value="${esc(valida.entrega)}"
        placeholder="Opcional: quién recibe en el hotel, detalles de la devolución…">
    </div>` : ''}

    ${b.total_kilos && !puedeRecoger ? `<p class="nota">Peso registrado: ${b.total_kilos} kg.${
      b.obs_lavanderia ? ' Nota del recojo: ' + esc(b.obs_lavanderia) : ''}</p>` : ''}

    ${perfil.rol === 'admin' ? bloqueAdmin(b) : ''}

    ${aviso?`<p class="aviso" role="alert">${esc(aviso)}</p>`:''}
    <div class="acciones">
      ${puedeVerificar ? `<button class="btn" id="verificar">Dar visto bueno de recepción</button>` : ''}
      ${puedeRecoger ? `<button class="btn" id="recoger">Confirmar recojo</button>` : ''}
      ${puedeEntregar ? `<button class="btn verde" id="entregar">Confirmar entrega al hotel</button>` : ''}
      ${b.estado !== 'registrada' ? `<button class="btn2" id="pdfDet">Descargar PDF</button>` : ''}
    </div>`;

  document.getElementById('atras').addEventListener('click', () => {
    abierta = null; detalle = []; vistaPanel(); window.scrollTo({top:0});
  });

  app.querySelectorAll('[data-cont]').forEach(el =>
    el.addEventListener('input', e => {
      const it = detalle.find(x => x.id === e.target.dataset.cont);
      it.contado = e.target.value.replace(/\D/g,'');
      guardarCampos(); vistaDetalle();
      const n = app.querySelector(`[data-cont="${it.id}"]`); n.focus();
    }));

  document.getElementById('kg')?.addEventListener('input', e => valida.kilos = e.target.value);
  document.getElementById('obsl')?.addEventListener('input', e => valida.obs = e.target.value);
  document.getElementById('obse')?.addEventListener('input', e => valida.entrega = e.target.value);

  document.getElementById('verificar')?.addEventListener('click', verificar);
  document.getElementById('recoger')?.addEventListener('click', recoger);
  document.getElementById('entregar')?.addEventListener('click', entregar);

  document.getElementById('pdfDet')?.addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'Generando…';
    await descargarPDF(b, detalle);
    e.target.disabled = false; e.target.textContent = 'Descargar PDF';
  });

  document.getElementById('guardarHotel')?.addEventListener('click', cambiarHotel);
  document.getElementById('anular')?.addEventListener('click', anular);
}

function bloqueAdmin(b){
  return `
    <div class="marco" style="margin-top:26px;border-color:var(--sello)">
      <h2 style="font-size:17px">Administración</h2>
      <p class="sub" style="font-size:15px">Corrige el hotel si se registró mal. La empresa de
      lavandería y el RUC se actualizan solos.</p>
      <div class="rejilla" style="margin-top:14px">
        <div>
          <label for="adminHotel">Hotel asignado</label>
          <select id="adminHotel">
            ${Object.keys(HOTELES).map(h =>
              `<option value="${h}" ${b.hospedaje === h.toUpperCase() ? 'selected' : ''}>${h}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn" id="guardarHotel" style="width:100%">Guardar hotel</button>
        </div>
      </div>
      <div class="acciones">
        ${b.estado === 'anulada'
          ? `<p class="sub" style="font-size:15px;margin:0">Anulada por ${
              esc(b.anulada_por_nombre || 'administración')}${b.anulada_en ? ' el ' + sello(b.anulada_en) : ''}.${
              b.motivo_anulacion ? ' Motivo: ' + esc(b.motivo_anulacion) : ''}</p>`
          : `<button class="btn2" id="anular" style="border-color:var(--sello);color:var(--sello)">
              Anular esta boleta</button>`}
      </div>
    </div>`;
}

function guardarCampos(){
  valida.kilos = document.getElementById('kg')?.value ?? valida.kilos;
  valida.obs = document.getElementById('obsl')?.value ?? valida.obs;
  valida.entrega = document.getElementById('obse')?.value ?? valida.entrega;
}

async function aplicar(cambios, boton, rotulo){
  const btn = document.getElementById(boton);
  if (btn) { btn.disabled = true; btn.textContent = rotulo; }
  const { error } = await sb.from('boletas').update(cambios).eq('id', abierta.id);
  if (error) { vistaDetalle('No se pudo registrar: ' + error.message); return false; }
  abierta = null; detalle = [];
  vistaPanel(); window.scrollTo({top:0});
  return true;
}

function verificar(){
  return aplicar({
    estado: 'verificada',
    verificada_por_nombre: perfil.nombre,
    verificada_en: new Date().toISOString()
  }, 'verificar', 'Registrando…');
}

async function recoger(){
  guardarCampos();
  const contado = detalle.reduce((s,i) => s + (parseInt(i.contado,10)||0), 0);
  if (valida.kilos === '' || isNaN(parseFloat(valida.kilos)))
    return vistaDetalle('Registra el total de kilos.');
  if (contado !== abierta.total_prendas && !valida.obs.trim())
    return vistaDetalle('Las cantidades no coinciden con lo declarado. Explica la diferencia en observaciones.');

  const btn = document.getElementById('recoger');
  if (btn) { btn.disabled = true; btn.textContent = 'Registrando…'; }
  for (const i of detalle) {
    const { error } = await sb.from('boleta_items')
      .update({ cantidad_confirmada: parseInt(i.contado,10) || 0 }).eq('id', i.id);
    if (error) return vistaDetalle('No se pudo guardar el conteo: ' + error.message);
  }
  return aplicar({
    estado: 'recogida',
    total_kilos: parseFloat(valida.kilos),
    obs_lavanderia: valida.obs.trim() || null,
    validado_por: sesion.user.id,
    validado_por_nombre: perfil.nombre,
    validado_en: new Date().toISOString()
  }, 'recoger', 'Registrando…');
}

function entregar(){
  guardarCampos();
  return aplicar({
    estado: 'entregada',
    obs_entrega: valida.entrega.trim() || null,
    entregada_por_nombre: perfil.nombre,
    entregada_en: new Date().toISOString()
  }, 'entregar', 'Registrando…');
}

async function cambiarHotel(){
  const nuevo = document.getElementById('adminHotel').value;
  const h = HOTELES[nuevo];
  const { error } = await sb.from('boletas').update({
    hospedaje: nuevo.toUpperCase(), lavanderia: h.empresa, ruc: h.ruc
  }).eq('id', abierta.id);
  if (error) return vistaDetalle('No se pudo cambiar el hotel: ' + error.message);
  abierta = { ...abierta, hospedaje: nuevo.toUpperCase(), lavanderia: h.empresa, ruc: h.ruc };
  vistaDetalle();
}

async function anular(){
  const motivo = prompt(`Anular la boleta Nº ${corr(abierta.numero)} de ${abierta.nombres}.\n\nEl número queda visible con el sello ANULADA. Escribe el motivo:`);
  if (motivo === null) return;
  if (!motivo.trim()) return vistaDetalle('Indica el motivo de la anulación.');
  return aplicar({
    estado: 'anulada',
    motivo_anulacion: motivo.trim(),
    anulada_por_nombre: perfil.nombre,
    anulada_en: new Date().toISOString()
  }, 'anular', 'Anulando…');
}
</script>
</body>
</html>
