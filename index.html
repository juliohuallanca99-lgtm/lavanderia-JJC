<style>

  *{box-sizing:border-box}

  main{max-width:760px; margin:0 auto; padding:32px 20px 64px}

  h1{font-size:30px; line-height:1.15; margin:8px 0 0}
  h2{font-size:19px; margin:0}

  a{color:var(--trama)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .cab{border-bottom:2px solid var(--tinta); padding-bottom:20px}
  .sub{color:var(--texto); max-width:62ch}

  .hero{

    background:#06245d;
    min-height:470px;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:

      url('portada.jpg') center/cover no-repeat;

  .topbar{
    position:relative; z-index:2; background:#fff; color:var(--tinta);
    min-height:78px; display:flex; align-items:center;
    box-shadow:0 2px 14px rgba(0,32,91,.12);

  .topbar-in{
    width:min(1240px, calc(100% - 40px)); margin:0 auto;

  .beneficios{display:flex; flex-wrap:wrap; gap:0; margin-top:30px; max-width:600px}
  .beneficio{display:flex; align-items:center; gap:10px; min-width:170px; padding:0 22px 0 0; margin:0 22px 12px 0; border-right:1px solid rgba(255,255,255,.25)}

  .beneficio svg{width:29px;height:29px;flex:none}
  .beneficio b{display:block;font-size:13px}

  .wave{position:absolute;z-index:2;left:-3%;right:-3%;bottom:-1px;height:54px;background:var(--papel);border-radius:50% 50% 0 0/100% 100% 0 0}

  .cuerpo{width:min(1240px, calc(100% - 40px)); margin:-30px auto 0; position:relative; z-index:4; padding-bottom:70px}
  .tarjetas{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; position:relative}
  .tj{
    min-height:0; overflow:hidden; position:relative;
    background:#fff; border:1px solid #dfe5f1; border-radius:16px; padding:22px 24px;
    box-shadow:0 14px 38px rgba(0,32,91,.12); text-decoration:none; color:inherit;
    display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s;
  }
  .tj:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(0,32,91,.17)}
  .tj::after{content:"";position:absolute;right:-35px;top:-35px;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,rgba(53,224,189,.08),rgba(27,58,107,.03));}
  .tj::before{
    content:""; position:absolute; right:0; top:0; bottom:0; width:44%;
    background-image:var(--img); background-size:cover; background-position:center;
    -webkit-mask-image:linear-gradient(to left, #000 48%, transparent 97%);
    mask-image:linear-gradient(to left, #000 48%, transparent 97%);
    opacity:.6; pointer-events:none; z-index:0;
  }
  .tj[data-sin-img]::before{display:none}
  .tj h2,.tj p,.tj .icon-circle,.tj .cta{position:relative; z-index:2}
  .tj h2{max-width:none; white-space:nowrap}
  .tj p{max-width:19ch}
  .tj h2{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:21px;line-height:1.2;margin:14px 0 7px;color:#10356e}
  .tj p{color:var(--texto);font-size:14.5px;line-height:1.5;flex:1;margin:0}
  .tj .icon-circle{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
  .tj .icon-circle svg{width:30px;height:30px}
  .tj:nth-child(1) .icon-circle{background:#d9edff}
  .tj:nth-child(2) .icon-circle{background:#d8f8ef}
  .tj:nth-child(3) .icon-circle{background:#e8e2ff}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;align-self:flex-start;color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;margin-top:16px;position:relative;z-index:1}
  .cta::after{content:'›';font-size:21px;line-height:12px}
  .cta.azul{background:#063d91}.cta.verde{background:#009c7e}.cta.morado{background:#4333a5}
  .buscador{
    display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #dbe3f0;
    border-radius:999px; padding:8px 9px 8px 20px; margin:26px auto 0; max-width:900px;
    box-shadow:0 10px 28px rgba(0,32,91,.10);
  }
  .buscador input{border:none;box-shadow:none !important;flex:1;padding:10px 0;font-size:15px;min-width:0}
  .buscador button{background:#08245c;color:#fff;border:none;border-radius:999px;font-weight:700;font-size:14px;padding:12px 25px;white-space:nowrap}
  .buscador button:hover{background:#1f3269}
  .seguimiento{margin-top:34px;background:#edf5ff;border:1px solid #dce8f7;border-radius:18px;padding:22px 24px}

  .ruta-home{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#fff;border-radius:14px;padding:20px 14px}
  .paso-home{text-align:center;position:relative;color:#153a72;font-size:12.5px;font-weight:700;padding-top:6px}
  .paso-home:not(:last-child)::after{content:'›';position:absolute;right:-6px;top:26px;font-size:22px;color:#2160a8}
  .paso-num{
    position:absolute;left:50%;top:0;transform:translateX(-46px);
    width:22px;height:22px;border-radius:50%;background:#1668c4;color:#fff;

  .paso-icon{width:48px;height:48px;border-radius:50%;background:#e4f0ff;border:1px solid #c8ddf7;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}
  .paso-icon svg{width:24px;height:24px}
  .paso-home:last-child .paso-icon{background:#d9f7ed;border-color:#a9e8d5}

  @media(max-width:1100px){

  /* --- Tablet vertical --- */
  @media(max-width:900px){
    .top-info{gap:10px;font-size:12px}.top-info .portal{padding-left:10px}
    .hero{min-height:420px}
    .hero h1{font-size:42px;max-width:12ch}
    .hero-in{padding:38px 0 78px}
    .tarjetas{grid-template-columns:repeat(2,1fr)}
    .tarjetas .tj:last-child{grid-column:1 / -1;min-height:180px}
    .tarjetas .tj:last-child p{max-width:40ch}
    .tj h2{white-space:normal}
    .tj p{max-width:26ch}
    .tj::before{width:34%;opacity:.4}
    .ruta-home{grid-template-columns:repeat(3,1fr);row-gap:24px}
    .paso-home:nth-child(3)::after{display:none}

    .tarjetas{grid-template-columns:1fr;gap:16px}
    .tarjetas .tj:last-child{grid-column:auto}
    .tj{min-height:0;padding:20px}
    .tj h2{font-size:20px;margin:12px 0 6px;white-space:normal}
    .tj p{max-width:30ch;font-size:14.5px}
    .tj::before{width:32%;opacity:.28}
    .tj .icon-circle{width:50px;height:50px}
    .paso-home:nth-child(2n)::after{display:none}
    .paso-desc{font-size:10.5px}
  }

  @media(max-width:400px){
    .hero h1{font-size:34px}
    .hero p.hero-desc{font-size:15px}
    .beneficios{grid-template-columns:1fr}
    .tj::before{display:none}
    .ruta-home{grid-template-columns:1fr;row-gap:18px;padding:16px 10px}
    .paso-home::after{display:none !important}
    .paso-num{transform:translateX(-42px)}
  }

function totalPrendas(){ return items.reduce((s,i) => s + (parseInt(i.cantidad,10)||0), 0); }

function campo(k, etiqueta, tipo='text', ph='', ro=false){
  return `<div>
    <label for="${k}">${etiqueta}</label>
    <input id="${k}" data-f="${k}" type="${tipo}" ${ro?'readonly':''}
      ${k==='dni'?'inputmode="numeric" maxlength="8" class="mono"':''}
      ${k==='lav_ruc'?'class="mono"':''}
      placeholder="${ph}" value="${esc(form[k])}">
  </div>`;
}

async function guardar(){
  if (!form.nombres.trim()) return vistaFormulario('Escribe tus nombres y apellidos.');
  if (!/^\d{8}$/.test(form.dni.trim())) return vistaFormulario('El DNI debe tener 8 dígitos.');
  if (!form.hospedaje.trim()) return vistaFormulario('Selecciona tu hospedaje.');
  if (totalPrendas() === 0) return vistaFormulario('Ingresa la cantidad de al menos una prenda.');

  const btn = document.getElementById('guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const { data: boleta, error: e1 } = await sb.from('boletas').insert({
      fecha: form.fecha,
      empresa: form.empresa.trim(),
      nombres: form.nombres.trim().toUpperCase(),
      dni: form.dni.trim(),
      hospedaje: form.hospedaje.trim().toUpperCase(),
      habitacion: form.habitacion.trim(),
      lavanderia: form.lav_empresa || null,
      ruc: form.lav_ruc || null,
      observaciones: form.observaciones.trim() || null,
      total_prendas: totalPrendas()
    }).select().single();
    if (e1) throw e1;

    const det = items.map((it,i) => ({
      boleta_id: boleta.id, tipo_ropa: TIPOS[i],
      cantidad: parseInt(it.cantidad,10) || 0,
      descripcion: it.descripcion.trim() || null, orden: i
    })).filter(x => x.cantidad > 0);

    const { error: e2 } = await sb.from('boleta_items').insert(det);
    if (e2) throw e2;

    emitida = { ...boleta, detalle: det };
    vistaEmitida();
    window.scrollTo({top:0});
  } catch (err) {
    vistaFormulario('No se pudo guardar la boleta: ' + (err.message || 'revisa tu conexión.'));
  }
}

async function descargarPDF(b, det){
  const caja = document.getElementById('tramoya');
  caja.innerHTML = hojaHTML(b, det);
  await html2pdf().set({
    margin: 8, filename: `Boleta_${corr(b.numero)}_${b.dni}.pdf`,
    image: { type:'jpeg', quality:0.96 },
    html2canvas: { scale:2, useCORS:true },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak: { mode: ['css','legacy'] }
  }).from(caja.firstElementChild).save();
  caja.innerHTML = '';
}

async function blobPDF(b, det){
  const caja = document.getElementById('tramoya');
  caja.innerHTML = hojaHTML(b, det);
  const blob = await html2pdf().set({
    margin: 8, image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(caja.firstElementChild).outputPdf('blob');
  caja.innerHTML = '';
  return blob;
}

function vistaMisBoletas(lista, aviso, dni='', autobuscar=false){
  app.innerHTML = `
    <header class="cab">
      <a class="volver" href="#/">← Inicio</a>
      <h1>Mis boletas</h1>
      <p class="sub">Escribe tu DNI para ver en qué paso va tu ropa.</p>

    <div style="display:flex;gap:12px;align-items:flex-end;margin-top:24px;flex-wrap:wrap">
      <div><label for="bdni">DNI</label>
        <input id="bdni" class="mono" inputmode="numeric" maxlength="8" style="width:170px" value="${esc(dni)}"></div>
      <button class="btn" id="buscar">Buscar</button>
    </div>
    ${aviso ? `<p class="aviso" role="alert">${esc(aviso)}</p>` : ''}
    ${lista ? (lista.length ? `<ul class="lista">${lista.map(tarjetaTrabajador).join('')}</ul>`
      : `<div class="marco" style="margin-top:32px">
           <strong>Todavía no hay boletas con ese DNI.</strong>
           <p><a href="#/boleta"><strong>Registrar mi primera boleta</strong></a></p></div>`) : ''}`;

  const input = document.getElementById('bdni');
  input.addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g,''));
  const go = async () => {
    const d = input.value.trim();
    if (!/^\d{8}$/.test(d)) return vistaMisBoletas(null, 'El DNI debe tener 8 dígitos.', d);
    const { data, error } = await sb.from('boletas').select('*').eq('dni', d).order('numero',{ascending:false});

    vistaMisBoletas(data || [], null, d);
  };
  document.getElementById('buscar').addEventListener('click', go);
  input.addEventListener('keydown', e => e.key === 'Enter' && go());
  if (autobuscar) go();
}

function tarjetaTrabajador(b){
  const i = indicePaso(b.estado);
  const anu = b.estado === 'anulada';
  const detalles = [
    b.verificada_en ? sello(b.verificada_en) : '',
    b.validado_en ? sello(b.validado_en) : '',
    b.entregada_en ? sello(b.entregada_en) : ''
  ];
  return `<li><div class="marco">
    <div class="lin1">
      <p class="numero mono" style="font-size:19px;margin:0">Nº ${corr(b.numero)}</p>
      <span class="estado ${claseEstado(b.estado)}">${textoEstado(b.estado)}</span>
    </div>
    <p style="color:var(--texto);font-size:15px;margin:6px 0 0">${fecha(b.fecha)} · ${esc(b.hospedaje)}${
      b.habitacion?` — Hab. ${esc(b.habitacion)}`:''} · ${b.total_prendas} prendas${
      b.total_kilos?` · ${b.total_kilos} kg`:''}</p>
    ${anu ? `<p class="aviso" style="margin-top:10px">Boleta anulada${

async function exportarExcel(lista){
  const btn = document.getElementById('excel');
  const rotulo = btn ? btn.textContent : '';
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Armando reporte…'; }

    const { data: todos } = await sb.from('boleta_items').select('*')
      .in('boleta_id', lista.map(b => b.id)).order('orden');

    const f = iso => iso ? new Date(iso).toLocaleString('es-PE') : '';

    // Hoja 1 — una fila por boleta
    const resumen = lista.map(b => {
      const det = (todos || []).filter(i => i.boleta_id === b.id);
      const contado = det.reduce((s,i) => s + (i.cantidad_confirmada ?? 0), 0);
      return {
        'Nº boleta': corr(b.numero),
        'Fecha': fecha(b.fecha),
        'Estado': b.estado === 'anulada' ? 'Anulada' : PASOS[indicePaso(b.estado)]?.largo || b.estado,
        'Trabajador': b.nombres,
        'DNI': b.dni,
        'Empresa': b.empresa,
        'Hospedaje': b.hospedaje,
        'Habitación': b.habitacion || '',
        'Empresa de lavandería': b.lavanderia || '',
        'RUC': b.ruc || '',
        'Prendas declaradas': b.total_prendas,
        'Prendas contadas': contado || '',
        'Diferencia': contado ? contado - b.total_prendas : '',
        'Kilos': b.total_kilos ?? '',
        'Verificado por': b.verificada_por_nombre || '',
        'Verificado el': f(b.verificada_en),
        'Recogido por': b.validado_por_nombre || '',
        'Recogido el': f(b.validado_en),
        'Entregado por': b.entregada_por_nombre || '',
        'Entregado el': f(b.entregada_en),
        'Obs. del trabajador': b.observaciones || '',
        'Obs. del recojo': b.obs_lavanderia || '',
        'Obs. de la entrega': b.obs_entrega || '',
        'Anulada por': b.anulada_por_nombre || '',
        'Motivo de anulación': b.motivo_anulacion || ''
      };
    });

    // Hoja 2 — una fila por prenda
    const porBoleta = Object.fromEntries(lista.map(b => [b.id, b]));
    const prendas = (todos || []).map(i => {
      const b = porBoleta[i.boleta_id] || {};
      return {
        'Nº boleta': corr(b.numero),
        'Fecha': fecha(b.fecha),
        'Trabajador': b.nombres,
        'DNI': b.dni,
        'Hospedaje': b.hospedaje,
        'Prenda': i.tipo_ropa,
        'Declarado': i.cantidad,
        'Contado': i.cantidad_confirmada ?? '',
        'Descripción': i.descripcion || ''
      };
    });

    const libro = XLSX.utils.book_new();
    const h1 = XLSX.utils.json_to_sheet(resumen);
    const h2 = XLSX.utils.json_to_sheet(prendas);
    h1['!cols'] = Object.keys(resumen[0] || {'':''}).map(k =>
      ({ wch: Math.min(Math.max(k.length + 2, 12), 30) }));
    h2['!cols'] = Object.keys(prendas[0] || {'':''}).map(k =>
      ({ wch: Math.min(Math.max(k.length + 2, 12), 30) }));
    h1['!freeze'] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(libro, h1, 'Boletas');
    XLSX.utils.book_append_sheet(libro, h2, 'Detalle de prendas');

    const tramo = (desde || hasta) ? `_${desde||'inicio'}_a_${hasta||'hoy'}` : `_${hoy()}`;
    XLSX.writeFile(libro, `Reporte_boletas${tramo}.xlsx`);
  } catch (err) {
    alert('No se pudo generar el Excel: ' + (err.message || err));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = rotulo; }
  }
}

async function descargarUnido(lista){
  const btn = document.getElementById('unido');
  const rotulo = btn ? btn.textContent : '';
  const caja = document.getElementById('tramoya');
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Preparando…'; }
    const { data: todos } = await sb.from('boleta_items').select('*')
      .in('boleta_id', lista.map(b => b.id)).order('orden');

    // Todas las hojas quedan en el DOM: html2canvas necesita elementos visibles
    caja.innerHTML = lista.map(b =>
      `<div>${hojaHTML(b, (todos || []).filter(i => i.boleta_id === b.id))}</div>`).join('');
    const hojas = Array.from(caja.children);

    const opc = { margin: 8, image:{type:'jpeg',quality:0.96},
                  html2canvas:{scale:2,useCORS:true},
                  jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
                  pagebreak:{mode:['css','legacy']} };

    let worker = html2pdf().set(opc).from(hojas[0]).toPdf();
    for (let i = 1; i < hojas.length; i++) {
      const hoja = hojas[i], n = i + 1;
      worker = worker
        .get('pdf').then(pdf => {
          if (btn) btn.textContent = `Armando página ${n} de ${hojas.length}…`;
          pdf.addPage();
        })
        .from(hoja).toContainer().toCanvas().toPdf();
    }

    const tramo = (desde || hasta) ? `_${desde||'inicio'}_a_${hasta||'hoy'}` : '';
    if (btn) btn.textContent = 'Guardando…';
    await worker.save(`Boletas_entregadas${tramo}.pdf`);
  } catch (err) {
    alert('No se pudo generar el PDF: ' + (err.message || err));
  } finally {
    caja.innerHTML = '';
    if (btn) { btn.disabled = false; btn.textContent = rotulo; }
  }
}

async function descargarZIP(lista){
  const btn = document.getElementById('zip');
  const rotulo = btn ? btn.textContent : '';
  const zip = new JSZip();
  const { data: todos } = await sb.from('boleta_items').select('*')
    .in('boleta_id', lista.map(b => b.id)).order('orden');
  let n = 0;
  for (const b of lista) {
    n++;
    if (btn) btn.textContent = `Generando ${n} de ${lista.length}…`;
    zip.file(`Boleta_${corr(b.numero)}_${b.dni}.pdf`,
             await blobPDF(b, (todos || []).filter(i => i.boleta_id === b.id)));
  }
  if (btn) btn.textContent = 'Comprimiendo…';
  const salida = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(salida);
  const a = document.createElement('a');
  const tramo = (desde || hasta) ? `_${desde||'inicio'}_a_${hasta||'hoy'}` : '';
  a.href = url; a.download = `Boletas_entregadas${tramo}.zip`;
  a.click();
  URL.revokeObjectURL(url);
  if (btn) btn.textContent = rotulo;
}

      </tbody>
    </table>
    ${cuenta && dif ? `<p class="aviso">El conteo no coincide con lo declarado. Anota el motivo antes de confirmar el recojo.</p>`:''}

    ${puedeRecoger ? `
    <div class="rejilla" style="grid-template-columns:170px 1fr">
      <div><label for="kg">Total kilos</label>
        <input id="kg" class="mono" type="number" step="0.01" min="0" value="${esc(valida.kilos)}"></div>
      <div><label for="obsl">Observaciones del recojo</label>
        <input id="obsl" value="${esc(valida.obs)}"
          placeholder="Prendas faltantes, manchas, detalles…"></div>
    </div>` : ''}

    ${puedeEntregar ? `
    <div style="margin-top:24px">
      <label for="obse">Observaciones de la entrega</label>
      <input id="obse" value="${esc(valida.entrega)}"
        placeholder="Opcional: quién recibe en el hotel, detalles de la devolución…">
    </div>` : ''}

    ${b.total_kilos && !puedeRecoger ? `<p class="nota">Peso registrado: ${b.total_kilos} kg.${
      b.obs_lavanderia ? ' Nota del recojo: ' + esc(b.obs_lavanderia) : ''}</p>` : ''}

    ${perfil.rol === 'admin' ? bloqueAdmin(b) : ''}

    ${aviso?`<p class="aviso" role="alert">${esc(aviso)}</p>`:''}
    <div class="acciones">
      ${puedeVerificar ? `<button class="btn" id="verificar">Dar visto bueno de recepción</button>` : ''}
      ${puedeRecoger ? `<button class="btn" id="recoger">Confirmar recojo</button>` : ''}
      ${puedeEntregar ? `<button class="btn verde" id="entregar">Confirmar entrega al hotel</button>` : ''}
      ${b.estado !== 'registrada' ? `<button class="btn2" id="pdfDet">Descargar PDF</button>` : ''}
    </div>`;

  document.getElementById('atras').addEventListener('click', () => {
    abierta = null; detalle = []; vistaPanel(); window.scrollTo({top:0});
  });

  app.querySelectorAll('[data-cont]').forEach(el =>
    el.addEventListener('input', e => {
      const it = detalle.find(x => x.id === e.target.dataset.cont);
      it.contado = e.target.value.replace(/\D/g,'');
      guardarCampos(); vistaDetalle();
      const n = app.querySelector(`[data-cont="${it.id}"]`); n.focus();
    }));

  document.getElementById('kg')?.addEventListener('input', e => valida.kilos = e.target.value);
  document.getElementById('obsl')?.addEventListener('input', e => valida.obs = e.target.value);
  document.getElementById('obse')?.addEventListener('input', e => valida.entrega = e.target.value);

  document.getElementById('verificar')?.addEventListener('click', verificar);
  document.getElementById('recoger')?.addEventListener('click', recoger);
  document.getElementById('entregar')?.addEventListener('click', entregar);

  document.getElementById('pdfDet')?.addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'Generando…';
    await descargarPDF(b, detalle);
    e.target.disabled = false; e.target.textContent = 'Descargar PDF';
  });

  document.getElementById('guardarHotel')?.addEventListener('click', cambiarHotel);
  document.getElementById('anular')?.addEventListener('click', anular);
}

function bloqueAdmin(b){
  return `
    <div class="marco" style="margin-top:26px;border-color:var(--sello)">
      <h2 style="font-size:17px">Administración</h2>
      <p class="sub" style="font-size:15px">Corrige el hotel si se registró mal. La empresa de
      lavandería y el RUC se actualizan solos.</p>
      <div class="rejilla" style="margin-top:14px">
        <div>
          <label for="adminHotel">Hotel asignado</label>
          <select id="adminHotel">
            ${Object.keys(HOTELES).map(h =>
              `<option value="${h}" ${b.hospedaje === h.toUpperCase() ? 'selected' : ''}>${h}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn" id="guardarHotel" style="width:100%">Guardar hotel</button>
        </div>
      </div>
      <div class="acciones">
        ${b.estado === 'anulada'
          ? `<p class="sub" style="font-size:15px;margin:0">Anulada por ${
              esc(b.anulada_por_nombre || 'administración')}${b.anulada_en ? ' el ' + sello(b.anulada_en) : ''}.${
              b.motivo_anulacion ? ' Motivo: ' + esc(b.motivo_anulacion) : ''}</p>`
          : `<button class="btn2" id="anular" style="border-color:var(--sello);color:var(--sello)">
              Anular esta boleta</button>`}
      </div>
    </div>`;
}

function guardarCampos(){
  valida.kilos = document.getElementById('kg')?.value ?? valida.kilos;
  valida.obs = document.getElementById('obsl')?.value ?? valida.obs;
  valida.entrega = document.getElementById('obse')?.value ?? valida.entrega;
}

async function aplicar(cambios, boton, rotulo){
  const btn = document.getElementById(boton);
  if (btn) { btn.disabled = true; btn.textContent = rotulo; }
  const { error } = await sb.from('boletas').update(cambios).eq('id', abierta.id);
  if (error) { vistaDetalle('No se pudo registrar: ' + error.message); return false; }
  abierta = null; detalle = [];
  vistaPanel(); window.scrollTo({top:0});
  return true;
}

function verificar(){
  return aplicar({
    estado: 'verificada',
    verificada_por_nombre: perfil.nombre,
    verificada_en: new Date().toISOString()
  }, 'verificar', 'Registrando…');
}

async function recoger(){
  guardarCampos();
  const contado = detalle.reduce((s,i) => s + (parseInt(i.contado,10)||0), 0);
  if (valida.kilos === '' || isNaN(parseFloat(valida.kilos)))
    return vistaDetalle('Registra el total de kilos.');
  if (contado !== abierta.total_prendas && !valida.obs.trim())
    return vistaDetalle('Las cantidades no coinciden con lo declarado. Explica la diferencia en observaciones.');

  const btn = document.getElementById('recoger');
  if (btn) { btn.disabled = true; btn.textContent = 'Registrando…'; }
  for (const i of detalle) {
    const { error } = await sb.from('boleta_items')
      .update({ cantidad_confirmada: parseInt(i.contado,10) || 0 }).eq('id', i.id);
    if (error) return vistaDetalle('No se pudo guardar el conteo: ' + error.message);
  }
  return aplicar({
    estado: 'recogida',
    total_kilos: parseFloat(valida.kilos),
    obs_lavanderia: valida.obs.trim() || null,
    validado_por: sesion.user.id,
    validado_por_nombre: perfil.nombre,
    validado_en: new Date().toISOString()
  }, 'recoger', 'Registrando…');
}

function entregar(){
  guardarCampos();
  return aplicar({
    estado: 'entregada',
    obs_entrega: valida.entrega.trim() || null,
    entregada_por_nombre: perfil.nombre,
    entregada_en: new Date().toISOString()
  }, 'entregar', 'Registrando…');
}

async function cambiarHotel(){
  const nuevo = document.getElementById('adminHotel').value;
  const h = HOTELES[nuevo];
  const { error } = await sb.from('boletas').update({
    hospedaje: nuevo.toUpperCase(), lavanderia: h.empresa, ruc: h.ruc
  }).eq('id', abierta.id);
  if (error) return vistaDetalle('No se pudo cambiar el hotel: ' + error.message);
  abierta = { ...abierta, hospedaje: nuevo.toUpperCase(), lavanderia: h.empresa, ruc: h.ruc };
  vistaDetalle();
}

async function anular(){
  const motivo = prompt(`Anular la boleta Nº ${corr(abierta.numero)} de ${abierta.nombres}.\n\nEl número queda visible con el sello ANULADA. Escribe el motivo:`);
  if (motivo === null) return;
  if (!motivo.trim()) return vistaDetalle('Indica el motivo de la anulación.');
  return aplicar({
    estado: 'anulada',
    motivo_anulacion: motivo.trim(),
    anulada_por_nombre: perfil.nombre,
    anulada_en: new Date().toISOString()
  }, 'anular', 'Anulando…');
}
</script>
</body>
</html>
